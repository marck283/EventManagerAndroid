plugins {
    id 'com.android.application'

    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.firebase.firebase-perf'
}

android {
    packagingOptions {
        resources {
            excludes += ['META-INF/proguard/androidx-annotations.pro']
        }
    }
    compileSdk = 37

    defaultConfig {
        applicationId = "it.disi.unitn.lpsmt.progetto.lasagna.eventmanager.eventmanager"
        minSdk = 36
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    namespace = 'it.disi.unitn.lpsmt.progetto.lasagna.eventmanager.eventmanager'
}

tasks.register("testClasses") {
    doLast {
        println = 'This is a dummy testClasses task'
    }
}

dependencies {
    implementation("androidx.room:room-runtime:2.8.5")
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.9.22'))
    implementation 'com.google.firebase:firebase-perf:23.0.0'
    implementation project(path: ':login')
    implementation project(path: ':network')
    implementation project(path: ':sharedPrefs')
    implementation project(path: ':eventcreation')
    implementation project(path: ':checkQRCode')
    implementation project(path: ':eventInfo')
    implementation project(':navigationsvm')
    implementation project(':localDatabase')
    implementation project(':userinfo')
    implementation project(':futuretaskext')
    implementation project(':ui_extra')
    implementation project(':geocoder')
    annotationProcessor("androidx.room:room-compiler:2.8.5")
    annotationProcessor('com.github.bumptech.glide:compiler:5.0.9')

    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.facebook.android:facebook-login:18.3.0'
    implementation "com.google.android.material:material:1.14.0"
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}